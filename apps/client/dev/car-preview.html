<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Car preview</title>
  <style>
    html, body { margin: 0; height: 100%; background: #111; overflow: hidden; font: 12px/1.4 system-ui, sans-serif; color: #ddd; }
    canvas { display: block; }
    #hud { position: fixed; left: 8px; top: 8px; background: rgba(0,0,0,0.5); padding: 6px 8px; border-radius: 6px; white-space: pre; pointer-events: none; }
    #ui { position: fixed; right: 8px; top: 8px; display: flex; flex-wrap: wrap; gap: 4px; max-width: 460px; justify-content: flex-end; }
    #ui button { background: rgba(20,24,28,0.8); color: #ddd; border: 1px solid #444; border-radius: 4px; padding: 3px 7px; cursor: pointer; font: inherit; }
    #ui button:hover { background: rgba(60,70,80,0.9); }
    body.shot #hud, body.shot #ui { display: none; }
  </style>
</head>
<body>
  <div id="hud"></div>
  <div id="ui"></div>
  <script type="module" src="./car-preview.ts"></script>
</body>
</html>
