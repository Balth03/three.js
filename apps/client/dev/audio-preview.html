<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Audio Preview</title>
  <style>
    :root { --bg: #111317; --panel: #1b1e24; --text: #e7e2d6; --muted: #9a9384; --accent: #e3b45a; --line: #2c3038; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 Inter, system-ui, sans-serif; }
    header { display: flex; gap: 12px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
    header h1 { font-size: 15px; margin: 0 12px 0 0; font-weight: 600; }
    main { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; padding: 12px 16px; }
    section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
    section h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
    label.row { display: grid; grid-template-columns: 96px 1fr 52px; gap: 8px; align-items: center; margin: 4px 0; }
    label.row span:last-child { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
    input[type=range] { width: 100%; accent-color: var(--accent); }
    button, select { background: #262a32; color: var(--text); border: 1px solid #3a3f49; border-radius: 6px; padding: 5px 9px; font: inherit; cursor: pointer; margin: 2px; }
    button:hover { border-color: var(--accent); }
    button.primary { background: var(--accent); color: #1a1408; border-color: var(--accent); font-weight: 600; }
    .checks label { margin-right: 10px; white-space: nowrap; }
    canvas { width: 100%; height: 140px; display: block; background: #0b0c0f; border-radius: 6px; }
    #status { color: var(--muted); }
    .wide { grid-column: 1 / -1; }
  </style>
</head>
<body>
  <header>
    <h1>Taxi audio preview</h1>
    <button id="start" class="primary">Start audio</button>
    <span id="status">not started</span>
  </header>
  <main id="ui"></main>
  <script type="module" src="./audio-preview.ts"></script>
</body>
</html>
